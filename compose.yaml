services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET must be set in the environment}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:?AUTH_TOKEN_SECRET must be set in the environment}
      SEED_PASSWORD: ${SEED_PASSWORD:?SEED_PASSWORD must be set in the environment}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:?EMBEDDING_BASE_URL must be set in the environment}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:?EMBEDDING_API_KEY must be set in the environment}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:?EMBEDDING_MODEL must be set in the environment}
      EMBEDDING_DIM: ${EMBEDDING_DIM:?EMBEDDING_DIM must be set in the environment}
      CHAT_MODEL: ${CHAT_MODEL:-doubao-seed-2-1-lite-260915}
      MCP_DEMO_BASE_URL: http://mcp-demo:8090
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?MCP_AUTH_TOKEN must be set in the environment}
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-campusclaw}
      MYSQL_USER: ${MYSQL_USER:-campusclaw}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set in the environment}
      QDRANT_URL: http://qdrant:6333
      SEED_MATERIALS_DIR: /data/seed-materials
    volumes:
      - app-data:/data
      - ./seed_materials:/data/seed-materials:ro
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      mcp-demo:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  mcp-demo:
    build: ./mcp-server
    environment:
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?MCP_AUTH_TOKEN must be set in the environment}
    expose:
      - "8090"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8090/health').read()"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  mysql:
    image: mysql:8.4
    command: --ngram-token-size=2
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-campusclaw}
      MYSQL_USER: ${MYSQL_USER:-campusclaw}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set in the environment}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set in the environment}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  qdrant:
    image: qdrant/qdrant:v1.12.5
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "echo > /dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  app-data:
  mysql-data:
  qdrant-data:
